name: Generate and publish HTML songbook suitable for printing

on:
  push:
    branches: [ master ]

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DEST_HTML_DIR: projekcia/chvaly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: songs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download opensong-print
        run: |
          mkdir -p opensong-print
          curl -fsSL -o opensong-print/opensong-print.jar https://github.com/ivankohut/opensong-print/releases/latest/download/opensong-print.jar

      - name: Generate HTML songbook
        working-directory: songs
        run: java -jar ../opensong-print/opensong-print.jar "Chvály" .

      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v7
        with:
          repository: ivankohut/ivankohut.github.io
          path: github-io
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Update local copy of GitHub Pages repository
        run: |
          rm -rf github-io/${{ env.DEST_HTML_DIR }}/*
          cp -r songs/html/* github-io/${{ env.DEST_HTML_DIR }}/

      - name: Commit and push to GitHub Pages
        working-directory: github-io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.DEST_HTML_DIR }}
          git diff --staged --quiet || git commit -m "Projekcia - piesne na tlač - aktualizácia z ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
